<title>French Alps RSVP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&display=swap">
<style>
  :root{
    /* Soft rainbow, left to right */
    --c1:#FFD3DE;  /* blush   */
    --c2:#FFDFC4;  /* peach   */
    --c3:#FDF3BE;  /* butter  */
    --c4:#CFF2DC;  /* mint    */
    --c5:#C9E6FF;  /* sky     */
    --c6:#E0D4FB;  /* lilac   */
    --label:#15131B;
    --ring:rgba(255,255,255,.55);
    --cast:rgba(20,18,26,.28);
  }

  html,body{height:100%;}
  /* Transparent on purpose: this is made to be embedded, so it sits on
     whatever background the host page has, light or dark. */
  body{
    background:transparent;
    margin:0;
    font-family:"Montserrat", system-ui, -apple-system, "Segoe UI", sans-serif;
    display:flex;align-items:center;justify-content:center;
    padding:16px;
  }
  *{box-sizing:border-box;}

  .stage{
    position:relative;
    width:100%;
    max-width:640px;
    min-height:320px;
    display:flex;align-items:center;justify-content:center;
  }

  canvas.fx{
    position:absolute;inset:0;
    width:100%;height:100%;
    pointer-events:none;
    z-index:2;
  }

  .btn{
    position:relative;
    z-index:1;
    display:inline-flex;align-items:center;justify-content:center;
    gap:clamp(12px, 3vw, 20px);
    max-width:100%;
    padding:clamp(18px, 4.4vw, 24px) clamp(26px, 7vw, 52px);
    border-radius:999px;
    text-decoration:none;
    color:var(--label);
    font-size:clamp(12px, 3.1vw, 16px);
    font-weight:700;
    letter-spacing:.16em;
    text-transform:uppercase;
    line-height:1.1;
    text-align:center;
    background-image:linear-gradient(100deg,
      var(--c1) 0%, var(--c2) 19%, var(--c3) 38%,
      var(--c4) 57%, var(--c5) 76%, var(--c6) 100%);
    background-size:220% 100%;
    background-position:0% 50%;
    box-shadow:
      inset 0 1px 0 var(--ring),
      0 2px 6px var(--cast),
      0 14px 34px -14px var(--cast);
    transition:background-position .9s ease, transform .16s ease, box-shadow .24s ease;
    -webkit-tap-highlight-color:transparent;
    animation:drift 14s ease-in-out infinite;
  }
  @keyframes drift{
    0%,100%{background-position:0% 50%;}
    50%    {background-position:100% 50%;}
  }

  .btn:hover{
    box-shadow:
      inset 0 1px 0 var(--ring),
      0 3px 8px var(--cast),
      0 20px 42px -14px var(--cast);
    transform:translateY(-2px);
  }
  .btn:active{transform:translateY(0) scale(.975);}
  .btn:focus-visible{
    outline:3px solid #15131B;
    outline-offset:4px;
  }

  .btn svg{
    width:1em;height:1em;flex:0 0 auto;
    transition:transform .22s ease;
  }
  .btn:hover svg{transform:translateX(4px);}

  @media (prefers-reduced-motion: reduce){
    .btn{animation:none;transition:none;}
    .btn:hover{transform:none;}
    .btn svg{transition:none;}
  }
</style>

<div class="stage" id="stage">
  <canvas class="fx" id="fx"></canvas>
  <a class="btn" id="btn"
     href="https://forms.zohopublic.com/dmills1/form/FrenchAlpsFun/formperma/j0ScZH-wwQpH0s-66yVkqhmWppL0ccm8Qqn50ok3-Tc"
     target="_blank" rel="noopener noreferrer">
    Click here to let us know!
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.4"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M5.5 2.5 11 8l-5.5 5.5"/>
    </svg>
  </a>
</div>

<script>
(function () {
  var stage  = document.getElementById("stage");
  var canvas = document.getElementById("fx");
  var btn    = document.getElementById("btn");
  var ctx    = canvas.getContext("2d");

  var reduced = false;
  try {
    reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  } catch (e) {}

  var CONFETTI = ["#F2789F", "#F9A03F", "#F7D154", "#5FBF7F", "#4FA3E3", "#9B7BE0", "#FFFFFF"];
  var bits = [];
  var running = false;
  var lastBurst = 0;
  var dpr = 1;

  function size() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    var r = stage.getBoundingClientRect();
    canvas.width  = Math.max(1, Math.round(r.width  * dpr));
    canvas.height = Math.max(1, Math.round(r.height * dpr));
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  size();
  window.addEventListener("resize", size);

  function rand(a, b) { return a + Math.random() * (b - a); }

  function burst() {
    if (reduced) return;
    var now = Date.now();
    if (now - lastBurst < 250) return;   // one burst per press
    lastBurst = now;

    var s = stage.getBoundingClientRect();
    var r = btn.getBoundingClientRect();
    var cx = r.left - s.left + r.width / 2;
    var cy = r.top  - s.top  + r.height / 2;

    for (var i = 0; i < 46; i++) {       // confetti
      var a = rand(0, Math.PI * 2), v = rand(3.2, 9.5);
      bits.push({
        kind: "c",
        x: cx + rand(-r.width / 3, r.width / 3),
        y: cy + rand(-6, 6),
        vx: Math.cos(a) * v,
        vy: Math.sin(a) * v - rand(1.5, 4.5),
        g: 0.22,
        w: rand(5, 9), h: rand(8, 15),
        rot: rand(0, Math.PI * 2), vr: rand(-0.3, 0.3),
        color: CONFETTI[(Math.random() * CONFETTI.length) | 0],
        life: 1, decay: rand(0.008, 0.016)
      });
    }
    for (var j = 0; j < 34; j++) {       // snow
      var a2 = rand(0, Math.PI * 2), v2 = rand(1.2, 5);
      bits.push({
        kind: "s",
        x: cx + rand(-r.width / 2.4, r.width / 2.4),
        y: cy + rand(-10, 10),
        vx: Math.cos(a2) * v2,
        vy: Math.sin(a2) * v2 - rand(0.5, 2.5),
        g: 0.045,
        rad: rand(1.6, 4),
        sway: rand(0.02, 0.07), phase: rand(0, Math.PI * 2),
        life: 1, decay: rand(0.005, 0.011)
      });
    }

    if (!running) { running = true; requestAnimationFrame(tick); }
  }

  function tick() {
    var w = canvas.width / dpr, h = canvas.height / dpr;
    ctx.clearRect(0, 0, w, h);

    for (var i = bits.length - 1; i >= 0; i--) {
      var p = bits[i];
      p.life -= p.decay;
      if (p.life <= 0 || p.y > h + 40) { bits.splice(i, 1); continue; }

      p.vy += p.g;
      p.vx *= 0.992;
      p.x  += p.vx;
      p.y  += p.vy;

      ctx.globalAlpha = Math.max(0, Math.min(1, p.life));

      if (p.kind === "c") {
        p.rot += p.vr;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h * Math.abs(Math.cos(p.rot * 0.7)));
        ctx.restore();
      } else {
        p.phase += p.sway;
        ctx.beginPath();
        ctx.arc(p.x + Math.sin(p.phase) * 6, p.y, p.rad, 0, Math.PI * 2);
        ctx.fillStyle = "#FFFFFF";
        ctx.shadowColor = "rgba(160,200,255,.9)";
        ctx.shadowBlur = 6;
        ctx.fill();
        ctx.shadowBlur = 0;
      }
    }
    ctx.globalAlpha = 1;

    if (bits.length) { requestAnimationFrame(tick); }
    else { running = false; ctx.clearRect(0, 0, w, h); }
  }

  // Fire on press so the burst starts before the new tab takes focus.
  btn.addEventListener("pointerdown", burst);
  btn.addEventListener("click", burst);
  btn.addEventListener("keydown", function (e) {
    if (e.key === "Enter" || e.key === " ") burst();
  });
})();
</script>
